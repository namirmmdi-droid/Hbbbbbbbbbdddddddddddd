<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برای اتنا</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Lalezar&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#5a1e33;--gold:#e8c57a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100%;background:#120a10}
body{min-height:100dvh}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.bg{position:fixed;inset:0;overflow:hidden;background:linear-gradient(135deg,#ff9fbd,#e0527f 55%,#9a2c5a);animation:hue 14s ease-in-out infinite alternate}
@keyframes hue{to{filter:hue-rotate(-14deg) saturate(1.15)}}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,236,224,.85),rgba(255,200,215,.35) 45%,transparent 70%);opacity:0;filter:blur(18px);animation:drift 11s ease-in-out infinite}
.bg i:nth-child(1){left:-15vmax;top:-10vmax}.bg i:nth-child(2){right:-20vmax;top:25vh;animation-delay:-4s}.bg i:nth-child(3){left:10vw;bottom:-30vmax;animation-delay:-8s}
@keyframes drift{0%{opacity:0;transform:translate(-10vw,6vh) scale(.8)}45%{opacity:.75;transform:translate(6vw,-4vh) scale(1.05)}100%{opacity:0;transform:translate(16vw,8vh) scale(.85)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.scr{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1.3s,transform 1.3s}
.scr.off{opacity:0;pointer-events:none;transform:scale(1.05)}
#msg{max-width:640px;text-shadow:0 2px 20px rgba(90,20,50,.6)}
.ln{font-size:clamp(19px,5vw,28px);font-weight:600;line-height:2.1;opacity:0;transform:translateY(14px);filter:blur(6px);transition:opacity 1.5s,transform 1.5s,filter 1.5s}
.ln.in{opacity:1;transform:none;filter:none}
#fin{font:600 clamp(60px,17vw,120px)/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;margin-top:6px;background:linear-gradient(180deg,#fff,#ffe2a8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(90,20,50,.5));opacity:0;transform:scale(.6);transition:opacity 1.2s,transform 1.4s cubic-bezier(.2,1.4,.4,1)}
#fin.in{opacity:1;transform:none}
.btn{margin-top:22px;padding:11px 30px;border:1px solid rgba(255,255,255,.8);color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border-radius:40px;font:600 16px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;cursor:pointer;opacity:0;transition:opacity 1s,background .3s;pointer-events:none}
.btn.in{opacity:1;pointer-events:auto}.btn:hover{background:rgba(255,255,255,.3)}
/* نامه‌ها */
.ttl{font-size:clamp(22px,5vw,30px);font-weight:800;text-shadow:0 2px 16px rgba(90,20,50,.5)}
.sub{margin:6px 0 26px;font-weight:300;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(2,auto);gap:22px 20px;justify-content:center}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,auto);gap:30px}}
.mn{background:none;border:0;color:#fff;font-family:inherit;cursor:pointer;width:150px;opacity:0;transform:translateY(-40px) rotate(-6deg);transition:opacity .9s,transform .9s}
#lt.show .mn{opacity:1;transform:none}
#lt.show .mn:nth-child(2){transition-delay:.2s}#lt.show .mn:nth-child(3){transition-delay:.4s}#lt.show .mn:nth-child(4){transition-delay:.6s}
.me{position:relative;width:150px;height:104px;border-radius:6px;background:linear-gradient(160deg,#fff3ea,#ffd3de);box-shadow:0 14px 28px rgba(80,15,45,.45);animation:flt 4s ease-in-out infinite;transition:filter .3s}
.mn:nth-child(2) .me{animation-delay:-1s}.mn:nth-child(3) .me{animation-delay:-2s}.mn:nth-child(4) .me{animation-delay:-3s}
@keyframes flt{50%{transform:translateY(-7px)}}
.mn:hover .me{filter:brightness(1.07)}
.me:before{content:"";position:absolute;left:0;right:0;top:0;height:60px;background:linear-gradient(180deg,#ffb7ca,#ff9fb8);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0}
.me .mk{position:absolute;left:50%;top:44px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0c0,#c99a45);display:grid;place-items:center}
svg.h{width:12px;fill:#8e2650}
.cap{display:block;margin-top:14px;font-size:14px;font-weight:600;line-height:1.8;text-shadow:0 1px 10px rgba(90,20,50,.6)}
/* overlay */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(70,10,40,.6);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .8s}
.ov.on{opacity:1;pointer-events:auto}
.env{position:absolute;width:min(300px,78vw);height:200px;perspective:900px;opacity:0;transition:opacity .5s}
.ov.on .env{opacity:1}
.ov.reading .env{opacity:0!important;transform:translateY(90px) scale(.9)!important;transition:opacity .7s,transform .7s!important}
.eb{position:absolute;inset:0;background:#f4b3c6;border-radius:6px;box-shadow:0 24px 60px rgba(40,5,25,.6)}
.sheet{position:absolute;left:8%;right:8%;top:12px;bottom:10px;background:repeating-linear-gradient(180deg,#fff8ef 0 19px,#f6e6dc 19px 20px);border-radius:3px;transition:transform 1s ease;z-index:1}
.ev{position:absolute;inset:0;z-index:2;background:linear-gradient(160deg,#ffe3e9,#ffc9d6);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);border-radius:6px}
.flap{position:absolute;top:0;left:0;right:0;height:108px;z-index:3;background:linear-gradient(180deg,#ffbcd0,#ff9fb8);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease}
.fs{position:absolute;left:50%;top:84px;width:32px;height:32px;margin-left:-16px;border-radius:50%;z-index:4;background:radial-gradient(circle at 35% 30%,#fff0c0,#c99a45);display:grid;place-items:center;transition:opacity .4s}
.cl{position:absolute;left:-4px;right:-4px;top:-2px;height:0;border-top:2px dashed #fff;z-index:5;transform:scaleX(0);transform-origin:right;filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
.sc{position:absolute;top:-26px;right:-30px;width:64px;height:40px;z-index:6;opacity:0}
.sc g{transform-box:fill-box;transform-origin:85% 50%}
.cut .cl{transform:scaleX(1);transition:transform 1.5s linear}
.cut .sc{opacity:1;transform:translateX(calc(-1 * (min(300px,78vw) + 20px)));transition:transform 1.5s linear,opacity .3s}
.cut .sc .a{animation:sa .22s infinite alternate}.cut .sc .b{animation:sb .22s infinite alternate}
@keyframes sa{to{transform:rotate(-16deg)}}@keyframes sb{to{transform:rotate(16deg)}}
.cutdone .sc{opacity:0;transition:opacity .3s}
.fo .flap{transform:rotateX(180deg);z-index:0}.fo .fs{opacity:0}.fo .cl{opacity:0;transition:opacity .4s}
.rise .sheet{transform:translateY(-105px)}
.rd{position:relative;width:min(560px,92vw);max-height:84vh;overflow:auto;background:linear-gradient(170deg,#fffaf2,#fbe9e0);color:var(--wine);border:1px solid var(--gold);outline:1px solid rgba(232,197,122,.55);outline-offset:-10px;border-radius:8px;padding:40px 30px 26px;opacity:0;transform:translateY(60px) scale(.5);transform-origin:50% 100%;pointer-events:none;transition:opacity .8s,transform 1s cubic-bezier(.2,.9,.3,1);box-shadow:0 30px 80px rgba(40,5,25,.6)}
.ov.reading .rd{opacity:1;transform:none;pointer-events:auto}
.rd h3{font-size:clamp(21px,5vw,27px);font-weight:800;text-align:center;margin-bottom:18px}
.rd p{font-size:clamp(15px,3.8vw,17px);line-height:2.25;margin-bottom:12px;opacity:0;transform:translateY(34px) scale(.97);filter:blur(5px);transition:opacity 1.1s,transform 1.1s,filter 1.1s}
.ov.reading .rd p{opacity:1;transform:none;filter:none}
.rd .sg{text-align:left;font-weight:600;color:#b0754a}
.rd .btn{display:block;margin:20px auto 0;opacity:1;pointer-events:auto;color:var(--wine);border-color:#c99a45;background:transparent}

/* ===== v3 ===== */
.scr{overflow-y:auto}#wel{justify-content:safe center}
.pics{display:flex;gap:clamp(8px,3vw,22px);justify-content:center;margin-bottom:18px}
.pol{width:clamp(88px,26vw,150px);padding:6px 6px 20px;background:#fff8ee;border-radius:3px;box-shadow:0 10px 26px rgba(70,10,40,.5);opacity:0;transform:translateY(-90px) rotate(12deg) scale(1.4);transition:opacity .5s,transform 1.1s cubic-bezier(.2,1.3,.4,1)}
.pol.in{opacity:1;transform:rotate(var(--r))}
.pol img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:2px}
.pol:nth-child(3) img{filter:brightness(1.8) contrast(1.05)}
.fl{position:fixed;bottom:-60px;z-index:1;pointer-events:none;opacity:0;animation:up linear infinite}
@keyframes up{10%{opacity:.85}90%{opacity:.7}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.sp{position:fixed;z-index:30;pointer-events:none;font-size:26px;animation:rise 1.8s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-120px) scale(1.2) rotate(15deg)}}
#fe{font-size:34px;margin-top:4px}
/* نامه‌های قدیمی */
.mn{transform:translateY(-75vh) rotate(-20deg) scale(.5);transition:opacity .6s,transform 1.5s cubic-bezier(.2,1.25,.35,1)}
#lt.show .mn{transform:rotate(var(--t))}
.me{background:linear-gradient(160deg,#e6cb97,#c9a46a);border-radius:3px;box-shadow:0 14px 28px rgba(50,20,15,.6),inset 0 0 24px rgba(120,70,20,.4)}
.me:before{background:linear-gradient(180deg,#d9b985,#bf9a62);border-radius:3px 3px 0 0}
.me:after{content:"";position:absolute;left:14px;bottom:14px;width:62px;height:24px;background:repeating-linear-gradient(180deg,rgba(80,40,15,.4) 0 2px,transparent 2px 8px)}
.me .mk,.fs{background:radial-gradient(circle at 35% 30%,#e8606a,#9b1b27 60%,#6d1019);box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.14)}
.me .mk{width:30px;height:30px;margin-left:-15px;top:42px}
.mk svg.h,.fs svg.h{fill:#ffd9d0}
.st{position:absolute;right:9px;bottom:9px;width:26px;height:30px;display:grid;place-items:center;font-size:14px;background:#f6e8cb;border:2px dotted #8b5a2b;transform:rotate(4deg);font-style:normal;z-index:3}
.env .st{width:44px;height:50px;font-size:24px;right:16px;bottom:14px}
.eb{background:#bf9a62}.ev{background:linear-gradient(160deg,#e8cf9c,#d1ad74)}
.ev:after{content:"";position:absolute;left:18px;bottom:22px;width:110px;height:36px;background:repeating-linear-gradient(180deg,rgba(80,40,15,.4) 0 2px,transparent 2px 12px)}
.flap{background:linear-gradient(180deg,#dcbd89,#c29c64)}
.sheet{background:repeating-linear-gradient(180deg,#f3e2bb 0 19px,#e6cf9f 19px 20px)}
.rd{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 20% 12%,rgba(255,250,225,.85),transparent 55%),radial-gradient(ellipse at 85% 92%,rgba(150,95,40,.3),transparent 50%),linear-gradient(170deg,#f2e1b9,#e4cb98);color:#3b2416;border:0;outline:0;border-radius:2px;box-shadow:inset 0 0 70px rgba(120,70,20,.5),0 30px 80px rgba(30,8,20,.65)}
.rd h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;font-size:clamp(24px,6vw,32px);color:#6b2a1a}
.rd p{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;font-size:clamp(17px,4.4vw,20px);line-height:2.3}
.rd .sg{color:#8b3a2a}.rd .btn{color:#6b2a1a;border-color:#8b5a2b}
.wx{width:46px;height:46px;border-radius:50%;margin:8px auto 0;background:radial-gradient(circle at 35% 30%,#e8606a,#9b1b27 60%,#6d1019);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.45);font-size:20px}
/* قیچی: چپ به راست، باز و بسته */
.sc{width:90px;height:48px;top:-26px;left:0;right:auto;transform:translateX(-90px)}
.sc g{transform-box:view-box;transform-origin:34px 24px}
.cl{transform-origin:left}
.cut .cl{transition:transform 1.8s linear}
.cut .sc{opacity:1;transform:translateX(calc(min(300px,78vw) - 90px));transition:transform 1.8s linear,opacity .3s}
.cut .sc .a{animation:sa .3s ease-in-out infinite}.cut .sc .b{animation:sb .3s ease-in-out infinite}
@keyframes sa{0%,100%{transform:rotate(17deg)}50%{transform:rotate(1deg)}}
@keyframes sb{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(-1deg)}}
.cutdone .sc{opacity:0;transition:opacity .3s}

/* ===== Final polish: centered letter carousel ===== */
:root{--wine:#4b182b;--gold:#e8c57a}
.bg{background:radial-gradient(ellipse at 50% 8%,#653044 0%,#29121d 43%,#0c090d 100%);animation:none}
.bg i{opacity:.22;filter:blur(35px)}
#fx{opacity:.34}
#wel{background:linear-gradient(180deg,rgba(14,7,12,.08),rgba(14,7,12,.2))}
#wel .ln{text-shadow:0 3px 24px rgba(28,4,14,.85)}
#fin{filter:drop-shadow(0 4px 22px rgba(0,0,0,.55))}
.btn{border-color:rgba(232,197,122,.8);background:rgba(48,18,31,.32);box-shadow:0 8px 28px #09040933}
.btn:hover{background:rgba(232,197,122,.15)}
#lt{justify-content:center;gap:0;padding:24px 0 30px;background:linear-gradient(180deg,rgba(9,7,10,.1),rgba(9,7,10,.3))}
#lt .ttl{font-size:clamp(23px,5vw,34px);letter-spacing:.2px}
#lt .sub{margin:7px 0 18px;color:#f1d9df}
.carousel{width:100%;max-width:1000px;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:clamp(2px,2vw,18px);padding:0 clamp(8px,2vw,20px);direction:ltr}
.carousel-window{height:clamp(260px,48vh,390px);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:pan-y;direction:ltr;isolation:isolate}
.carousel-card{position:absolute;top:50%;left:50%;width:clamp(165px,43vw,270px);height:clamp(205px,35vh,280px);transform:translate(-50%,-50%);border:1px solid rgba(246,221,166,.75);border-radius:8px;padding:0;background:linear-gradient(145deg,#ead4a5,#b58b52);box-shadow:0 22px 48px rgba(0,0,0,.42),inset 0 0 0 5px rgba(255,247,220,.16);color:#432416;cursor:pointer;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s,filter .45s;overflow:hidden;transform-origin:center;}
.carousel-card:before{content:"";position:absolute;inset:10px;border:1px solid rgba(104,61,31,.35);pointer-events:none}
.carousel-card:after{content:"";position:absolute;left:20px;right:20px;bottom:35px;height:32px;opacity:.35;background:repeating-linear-gradient(to bottom,transparent 0 7px,#6c4a2a 7px 8px);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.carousel-card .card-number{position:absolute;top:20px;left:0;right:0;font:12px 'Vazirmatn',sans-serif;letter-spacing:3px;opacity:.7}
.carousel-card .card-seal{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#ffe8cf;font-size:25px;background:radial-gradient(circle at 35% 25%,#d86b6b,#8f1d2a 65%,#59101b);box-shadow:0 5px 12px #4b1b1b55,inset 0 0 0 3px #e5b6a65c}
.carousel-card .card-title{position:absolute;left:18px;right:18px;top:59%;font-size:clamp(15px,3.5vw,19px);font-weight:800;line-height:1.8;text-align:center;direction:rtl}
.carousel-card .card-hint{position:absolute;left:0;right:0;bottom:13px;font-size:11px;opacity:.72;direction:rtl}
.carousel-card.active{z-index:4;opacity:1;filter:none;transform:translate(-50%,-50%) scale(1) rotate(0deg)}
.carousel-card.prev{z-index:3;opacity:.76;filter:brightness(.78);transform:translate(calc(-50% - 72%),-50%) scale(.79) rotate(-7deg)}
.carousel-card.next{z-index:3;opacity:.76;filter:brightness(.78);transform:translate(calc(-50% + 72%),-50%) scale(.79) rotate(7deg)}
.carousel-card.hidden-left{z-index:1;opacity:0;pointer-events:none;transform:translate(calc(-50% - 125%),-50%) scale(.62) rotate(-12deg)}
.carousel-card.hidden-right{z-index:1;opacity:0;pointer-events:none;transform:translate(calc(-50% + 125%),-50%) scale(.62) rotate(12deg)}
.carousel-arrow{width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,197,122,.75);background:rgba(27,12,19,.55);color:#f5dca4;font-size:27px;line-height:1;display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s;z-index:6}
.carousel-arrow:hover{transform:scale(1.08);background:rgba(117,55,70,.6)}
.carousel-arrow:focus-visible,.carousel-card:focus-visible{outline:2px solid #fff1c8;outline-offset:4px}
.carousel-footer{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:7px;color:#f2dfc3;font-size:12px}
.carousel-dots{display:flex;gap:7px;direction:ltr}
.carousel-dots button{width:6px;height:6px;border:0;border-radius:99px;background:#f4d9dc70;padding:0;transition:width .25s,background .25s}
.carousel-dots button.active{width:20px;background:#e8c57a}
.carousel-tip{margin-top:14px;font-size:11px;color:#d7c0c7;opacity:.82}
#ov{background:rgba(13,5,10,.83);backdrop-filter:blur(12px)}
.rd{max-height:min(82dvh,760px);overscroll-behavior:contain;padding:42px clamp(22px,5vw,42px) 26px}
.rd h3{margin-bottom:22px}
.rd p{overflow-wrap:anywhere}
@media(max-width:600px){
 .carousel{grid-template-columns:34px minmax(0,1fr) 34px;gap:0;padding:0 3px}
 .carousel-arrow{width:32px;height:32px;font-size:21px}
 .carousel-window{height:clamp(250px,43vh,340px)}
 .carousel-card{width:clamp(150px,52vw,220px);height:clamp(205px,32vh,250px)}
 .carousel-card.prev{transform:translate(calc(-50% - 66%),-50%) scale(.76) rotate(-7deg)}
 .carousel-card.next{transform:translate(calc(-50% + 66%),-50%) scale(.76) rotate(7deg)}
 .carousel-card .card-seal{width:53px;height:53px}
 .carousel-footer{margin-top:12px}
 .rd{padding:36px 24px 24px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

/* فونت سیستمی و ایموجی بومی هر دستگاه؛ روی آیفون از Apple Color Emoji استفاده می‌شود */
.emoji,.emj{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
button,input,textarea{font-family:inherit}


/* ===== Mobile-first polish: wax seal, tactile paper, Persian typography ===== */
:root{--paper:#f3e4c5;--paper-ink:#4a2b20;--wax:#9c1f32;--wax-light:#d95a60}
html{height:100%;height:-webkit-fill-available;scroll-behavior:smooth}
body{font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",sans-serif;min-height:100dvh;min-height:-webkit-fill-available;overscroll-behavior:none}
button{font:inherit;touch-action:manipulation}
/* A tactile envelope with a raised wax seal */
.env{width:min(320px,82vw);height:clamp(170px,25vh,205px);filter:drop-shadow(0 20px 28px rgba(0,0,0,.22))}
.eb{background:linear-gradient(145deg,#d9bd83,#a97a43 78%);border:1px solid rgba(255,236,184,.7);box-shadow:inset 0 0 0 5px rgba(255,244,212,.13),inset 0 -12px 24px rgba(75,38,18,.18),0 22px 60px rgba(0,0,0,.35)}
.ev{background:linear-gradient(150deg,#ead5a7,#c6a16a 85%);filter:drop-shadow(0 -1px 1px rgba(255,245,216,.3))}
.flap{height:clamp(88px,13vh,108px);background:linear-gradient(180deg,#ead5a7,#c8a16a);backface-visibility:hidden;box-shadow:inset 0 -1px 0 rgba(255,244,209,.3)}
.sheet{background:linear-gradient(90deg,rgba(123,82,43,.06),transparent 12%,transparent 88%,rgba(123,82,43,.06)),repeating-linear-gradient(180deg,#fff6df 0 23px,#ead8b5 23px 24px);box-shadow:0 0 16px rgba(73,43,22,.12);border:1px solid #d9bd8d}
.fs{width:42px;height:42px;top:74px;margin-left:-21px;background:radial-gradient(circle at 32% 25%,#f0807a 0,#c83d49 28%,#8e1427 68%,#5f0d1c 100%);border:2px solid #e7c77c;box-shadow:0 4px 8px rgba(54,12,20,.45),inset 0 0 0 2px rgba(255,223,167,.3),inset 0 -4px 7px rgba(60,0,10,.25);transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .45s}
.fs:after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,218,151,.6);border-radius:50%;pointer-events:none}
.fs svg.h{width:15px;height:15px;fill:#ffe8bd;filter:drop-shadow(0 1px 1px #6b101b)}
.cutdone .fs{transform:scale(.72) rotate(-18deg);opacity:.18}
.fo .flap{transform:rotateX(180deg);z-index:0}
.rise .sheet{transform:translateY(calc(-1 * clamp(78px,14vh,105px))) rotate(-1deg)}
.cl{border-top:1px dashed rgba(255,239,197,.9);filter:drop-shadow(0 0 4px rgba(255,220,150,.65))}
/* Reading surface: warm paper, clean type, comfortable line lengths */
.rd{font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;width:min(560px,calc(100vw - 28px));max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 24px);padding:clamp(30px,5vw,44px) clamp(20px,5vw,38px) 24px;background:radial-gradient(ellipse at 18% 8%,rgba(255,252,232,.9),transparent 55%),linear-gradient(165deg,#f7e9ca,#e7d0a1);color:var(--paper-ink);border:1px solid #c59b5c;outline:1px solid rgba(255,232,180,.45);outline-offset:-7px;border-radius:4px;box-shadow:inset 0 0 45px rgba(117,74,32,.12),0 28px 75px rgba(0,0,0,.48);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#b58a54 transparent}
.rd:before{content:"✦  ✧  ✦";display:block;text-align:center;color:#a77a3d;letter-spacing:7px;font-size:14px;margin:0 0 13px}
.rd h3{font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:clamp(20px,5.3vw,28px);line-height:1.75;font-weight:700;color:#6e2630;text-wrap:balance;margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid rgba(153,105,53,.32)}
.rd p{font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:clamp(15px,4.1vw,18px);line-height:2.15;letter-spacing:0;word-break:normal;overflow-wrap:anywhere;text-align:right;color:#493126;margin-bottom:16px}
.rd .sg{color:#8b3a2a;font-weight:700;text-align:left;margin-top:22px}
.rd .wx{width:43px;height:43px;margin:16px auto 0;background:radial-gradient(circle at 32% 25%,#f0807a,#bd3040 35%,#771323 78%);border:2px solid #d9b56c;box-shadow:0 4px 9px rgba(76,24,25,.25),inset 0 0 0 2px rgba(255,225,174,.22)}
.rd .btn{position:sticky;bottom:0;min-height:46px;padding:10px 24px;border-radius:28px;margin:20px auto 0;background:rgba(255,248,225,.88);color:#692631;border:1px solid #b88a4d;box-shadow:0 5px 16px rgba(95,58,24,.12);font-size:15px}
.rd .btn:active{transform:scale(.98)}
.carousel-card,.carousel-arrow,.carousel-dots button,.btn{touch-action:manipulation}
.carousel-card{font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.carousel-card .card-number{font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:1.8px}
.carousel-card .card-title{font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-weight:700;line-height:1.9}
.carousel-card .card-hint{font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,sans-serif}
#lt .ttl,#lt .sub,#wel .ln,#closeW{font-family:"Vazirmatn",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#lt .ttl{line-height:1.7}
#lt .sub{line-height:1.9;padding:0 16px;text-wrap:balance}
#wel .ln{line-height:2;font-size:clamp(17px,4.8vw,27px);text-wrap:balance}
#wel .btn{min-height:46px}
@media(max-width:600px){
  .scr{padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));}
  #wel{justify-content:center;gap:0}
  .pics{gap:8px;margin-bottom:clamp(12px,2.5vh,20px)}
  .pol{width:clamp(76px,24vw,112px);padding:5px 5px 15px}
  #lt{justify-content:center;overflow-y:auto;overscroll-behavior:contain;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  #lt .ttl{font-size:clamp(21px,6vw,27px);padding:0 8px}
  #lt .sub{font-size:13px;margin:4px 0 12px}
  .carousel{grid-template-columns:32px minmax(0,1fr) 32px;gap:0;padding:0 2px}
  .carousel-window{height:clamp(230px,37dvh,310px);min-height:220px}
  .carousel-card{width:clamp(146px,51vw,205px);height:clamp(196px,30dvh,242px);border-radius:7px}
  .carousel-card.prev{transform:translate(calc(-50% - 61%),-50%) scale(.73) rotate(-6deg)}
  .carousel-card.next{transform:translate(calc(-50% + 61%),-50%) scale(.73) rotate(6deg)}
  .carousel-card .card-seal{width:49px;height:49px;font-size:22px;top:34%}
  .carousel-card .card-title{left:12px;right:12px;top:55%;font-size:clamp(13px,3.7vw,16px)}
  .carousel-card .card-number{top:15px;font-size:10px;letter-spacing:1.2px}
  .carousel-card .card-hint{font-size:10px;bottom:11px}
  .carousel-arrow{width:30px;height:36px;border-radius:15px;font-size:22px}
  .carousel-footer{margin-top:8px}
  .carousel-tip{font-size:10px;margin-top:10px;padding:0 14px;line-height:1.8}
  .ov{align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 0 calc(12px + env(safe-area-inset-bottom,0px));}
  .env{width:min(300px,78vw);height:clamp(160px,24vh,190px)}
  .rd{width:calc(100vw - 24px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 24px);padding:29px 20px 18px;border-radius:4px}
  .rd:before{margin-bottom:10px;font-size:12px}
  .rd h3{font-size:clamp(19px,5.4vw,24px);line-height:1.8;margin-bottom:16px;padding-bottom:12px}
  .rd p{font-size:15px;line-height:2.05;margin-bottom:13px}
  .rd .btn{width:100%;max-width:280px;min-height:46px;margin-top:16px}
}
@media(max-height:680px) and (max-width:600px){
  #wel{justify-content:flex-start;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .pics{margin-bottom:8px}
  .pol{width:clamp(68px,21vw,92px);padding-bottom:12px}
  .ln{line-height:1.75}
  #lt .sub{margin-bottom:6px}
  .carousel-window{height:225px;min-height:210px}
  .carousel-card{height:190px}
  .carousel-tip{margin-top:6px}
}
@media(prefers-reduced-motion:reduce){.env,.fs,.flap,.sheet,.rd,.rd p{transition-duration:.01ms!important}}

</style>

function launch(tx,ty){R.push({x:tx??W*(.15+Math.random()*.7),y:H,ty:ty??H*(.12+Math.random()*.38),v:H/62*(.9+Math.random()*.25),p:COL[Math.random()*4|0]})}
function burst(x,y,p){const n=80,k=Math.min(W,H)/620+.35;
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.1,s=(1.5+Math.random()*4.2)*k;
    S.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.011+Math.random()*.009,c:p[i%2]})}}
function loop(t){
  c.globalCompositeOperation='destination-out';c.fillStyle='rgba(0,0,0,.22)';c.fillRect(0,0,W,H);
  c.globalCompositeOperation='lighter';
  if(t>nextL){launch();nextL=t+rate*(.6+Math.random()*.9)}
  for(let i=R.length-1;i>=0;i--){const r=R[i];r.y-=r.v;c.fillStyle=r.p[0];c.beginPath();c.arc(r.x,r.y,2.2,0,7);c.fill();
    if(r.y<=r.ty){burst(r.x,r.y,r.p);R.splice(i,1)}}
  for(let i=S.length-1;i>=0;i--){const s=S[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy=s.vy*.985+.05;s.l-=s.d;
    if(s.l<=0){S.splice(i,1);continue}
    c.globalAlpha=Math.min(1,s.l*1.4);c.fillStyle=s.c;c.beginPath();c.arc(s.x,s.y,1.1+s.l*1.5,0,7);c.fill();c.globalAlpha=1}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
[0,350,800].forEach(d=>setTimeout(()=>launch(),d));
$('wel').addEventListener('pointerdown',e=>{if(e.target.id!=='closeW'){launch(e.clientX,e.clientY);spawn(['💋','🩷','💞','🫶'][Math.random()*4|0],e.clientX,e.clientY)}});

/* ---- نامه‌ها ---- */
let activeLetter=0;
const carouselWindow=$('carouselWindow'),carouselDots=$('carouselDots');
function renderCarousel(){
  carouselWindow.innerHTML='';carouselDots.innerHTML='';
  LETTERS.forEach((L,i)=>{
    const b=document.createElement('button');b.className='carousel-card';b.type='button';
    b.setAttribute('aria-label',`باز کردن نامه ${L.title}`);
    b.innerHTML=`<span class="card-number">LETTER · ${fa(i+1).padStart(2,'۰')}</span><span class="card-seal">${STAMPS[i]}</span><span class="card-title">${L.title}</span><span class="card-hint">برای باز کردن لمس کن</span>`;
    b.addEventListener('click',()=>{if(i!==activeLetter){activeLetter=i;updateCarousel()}else openLetter(i,b)});
    carouselWindow.appendChild(b);
    const dot=document.createElement('button');dot.type='button';dot.setAttribute('aria-label',`رفتن به نامه ${fa(i+1)}`);dot.addEventListener('click',()=>{activeLetter=i;updateCarousel()});carouselDots.appendChild(dot);
  });
  updateCarousel();
}
function updateCarousel(){
  const cards=[...carouselWindow.children],dots=[...carouselDots.children],n=cards.length;
  cards.forEach((card,i)=>{
    const delta=(i-activeLetter+n)%n;
    card.classList.remove('active','prev','next','hidden-left','hidden-right');
    if(delta===0)card.classList.add('active');
    else if(delta===n-1)card.classList.add('prev');
    else if(delta===1)card.classList.add('next');
    else card.classList.add(delta<n/2?'hidden-right':'hidden-left');
    card.setAttribute('aria-hidden',delta===0?'false':'true');
    card.tabIndex=delta===0?0:-1;
  });
  dots.forEach((d,i)=>d.classList.toggle('active',i===activeLetter));
  $('letterCount').textContent=`${fa(activeLetter+1).padStart(2,'۰')} از ${fa(n).padStart(2,'۰')}`;
}
function moveLetter(step){activeLetter=(activeLetter+step+LETTERS.length)%LETTERS.length;updateCarousel()}
$('prevLetter').addEventListener('click',()=>moveLetter(-1));$('nextLetter').addEventListener('click',()=>moveLetter(1));
let touchX=0;carouselWindow.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});
carouselWindow.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)moveLetter(dx<0?1:-1)},{passive:true});
carouselWindow.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')moveLetter(1);if(e.key==='ArrowRight')moveLetter(-1)});
renderCarousel();

const ov=$('ov'),env=$('env'),rd=$('rd');let busy=false;const T=[];
const later=(f,ms)=>T.push(setTimeout(f,ms));
function openLetter(i,src){if(busy)return;busy=true;const L=LETTERS[i];
  rd.innerHTML=`<h3>${L.title}</h3>${L.paras.filter(p=>!p.startsWith('/*')).map((p,k)=>`<p>${p} ${EM[(i+k*2)%EM.length]}</p>`).join('')}${L.sign?`<p class="sg">${L.sign}</p>`:''}<div class="wx">💋</div><button class="btn" id="closeL">بستن نامه و برگشتن</button>`;
  rd.querySelectorAll('p').forEach((p,k)=>p.style.transitionDelay=(.7+k*.7)+'s');
  $('closeL').onclick=closeLetter;
  ov.classList.add('on');
  // پرواز از جای کارت کوچک به وسط صفحه
  const r=src.getBoundingClientRect(),e=env.getBoundingClientRect();
  const dx=r.left+r.width/2-(e.left+e.width/2),dy=r.top+r.height/2-(e.top+e.height/2);
  env.style.transition='none';env.style.transform=`translate(${dx}px,${dy}px) scale(${r.width/e.width})`;env.style.opacity=1;
  env.offsetWidth;
  env.style.transition='transform 1.1s cubic-bezier(.3,.8,.2,1),opacity .5s';env.style.transform='none';
  later(()=>env.classList.add('cut'),1300);          // قیچی شروع می‌کنه
  later(()=>env.classList.add('cutdone'),3200);
  later(()=>env.classList.add('fo'),3300);           // لبه‌ی بریده‌شده باز می‌شه
  later(()=>env.classList.add('rise'),4200);         // نامه از داخل بیرون میاد
  later(()=>{ov.classList.add('reading');busy=false},5300); // متن بیرون میاد
}
function closeLetter(){if(busy)return;busy=true;T.forEach(clearTimeout);T.length=0;
  rd.querySelectorAll('p').forEach(p=>p.style.transitionDelay='0s');
  ov.classList.remove('reading');
  later(()=>ov.classList.remove('on'),700);
  later(()=>{env.className='env';env.style.transition='none';env.style.transform='';env.style.opacity='';busy=false},1600)}
addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('reading'))closeLetter()});
</script>
